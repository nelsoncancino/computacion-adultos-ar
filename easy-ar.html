<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>AR fácil - Computación para Adultos</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#07111f;color:#fff}
    .wrap{min-height:100vh;display:flex;flex-direction:column}
    header{padding:22px 18px 8px;text-align:center}
    h1{margin:0;font-size:26px}
    p{margin:8px auto 0;max-width:620px;line-height:1.4;opacity:.9}
    model-viewer{
      width:100%;
      flex:1;
      min-height:62vh;
      background:radial-gradient(circle at 50% 38%,#1b396a 0,#07111f 62%);
    }
    .arbtn{
      border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:800;
      background:#5ce1e6;color:#062033;box-shadow:0 8px 24px rgba(0,0,0,.28)
    }
    .tip{
      padding:14px 18px 20px;text-align:center;font-size:14px;opacity:.92
    }
    .fallback{
      display:block;margin:10px auto 0;width:min(92vw,520px);padding:12px;border-radius:12px;
      background:rgba(255,255,255,.07)
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Computación para Adultos</h1>
      <p>Giralo con el dedo. Después tocá el botón para colocarlo en realidad aumentada.</p>
    </header>

    <model-viewer
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
      alt="Modelo 3D para demostración de realidad aumentada"
      ar
      ar-modes="scene-viewer quick-look webxr"
      ar-scale="auto"
      camera-controls
      auto-rotate
      shadow-intensity="1.5"
      exposure="1"
      touch-action="pan-y">

      <button slot="ar-button" class="arbtn">
        VER EN MI ESPACIO
      </button>

    </model-viewer>

    <div class="tip">
      <strong>Prueba:</strong> tocá <b>VER EN MI ESPACIO</b> y seguí las instrucciones del teléfono.
      <div class="fallback">
        Acá no hay marcador HIRO. La idea es que el objeto aparezca directamente sobre una mesa o el piso.
      </div>
    </div>
  </div>
</body>
</html>
