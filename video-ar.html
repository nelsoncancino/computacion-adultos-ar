<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Computación B - AR Video</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    .example-container{overflow:hidden;position:absolute;width:100%;height:100%;inset:0}

    #hud{
      position:fixed;z-index:100;top:12px;left:50%;transform:translateX(-50%);
      width:min(92vw,540px);padding:10px 14px;border-radius:12px;
      background:rgba(0,0,0,.72);color:#fff;text-align:center;font-weight:700;
      pointer-events:none
    }

    #videoOverlay{
      position:fixed;z-index:300;inset:0;display:none;align-items:center;justify-content:center;
      background:rgba(0,0,0,.18);padding:16px;pointer-events:none
    }

    #videoBox{
      width:min(94vw,760px);aspect-ratio:16/9;border-radius:16px;overflow:hidden;
      background:#000;border:3px solid #fff;box-shadow:0 18px 60px rgba(0,0,0,.65);
      pointer-events:auto
    }

    #yt{width:100%;height:100%;border:0;display:block}
  </style>
</head>

<body>
  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="card"
          src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-plane
          src="#card"
          position="0 0 0"
          height="0.552"
          width="1"
          rotation="0 0 0"
          material="opacity: 0.01; transparent: true">
        </a-plane>
      </a-entity>
    </a-scene>
  </div>

  <div id="hud">Permití la cámara. Después apuntá a la imagen de prueba.</div>

  <div id="videoOverlay">
    <div id="videoBox">
      <iframe id="yt"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
  </div>

  <script>
    const target = document.getElementById('target');
    const hud = document.getElementById('hud');
    const overlay = document.getElementById('videoOverlay');
    const yt = document.getElementById('yt');
    const scene = document.querySelector('a-scene');

    const videoUrl =
      'https://www.youtube-nocookie.com/embed/2H0oW_kYbJ8' +
      '?autoplay=1&mute=1&playsinline=1&controls=1&rel=0';

    scene.addEventListener('arReady', () => {
      hud.textContent = 'Cámara lista. Apuntá a la imagen de prueba.';
    });

    scene.addEventListener('arError', () => {
      hud.textContent = 'No pude abrir la cámara. Revisá el permiso de cámara de este sitio.';
    });

    target.addEventListener('targetFound', () => {
      hud.textContent = '¡Imagen detectada!';
      if (!yt.src) yt.src = videoUrl;
      overlay.style.display = 'flex';
    });

    target.addEventListener('targetLost', () => {
      hud.textContent = 'Imagen perdida. Volvé a apuntar.';
      overlay.style.display = 'none';
      yt.src = '';
    });
  </script>
</body>
</html>
