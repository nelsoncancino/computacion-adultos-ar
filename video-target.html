<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Imagen de prueba - Computación B</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f3f5f7;color:#111}
    main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    h1{margin:0 0 8px;text-align:center}
    p{text-align:center;max-width:700px;line-height:1.4}
    img{width:min(72vw,360px);height:auto;display:block;background:white;box-shadow:0 10px 28px rgba(0,0,0,.18)}
    .note{margin-top:18px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Imagen de prueba</h1>
    <p>Dejá esta imagen abierta en la computadora. Ahora está en tamaño tipo tarjeta, más parecido a una imagen dentro de Canva.</p>
    <img
      src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png"
      alt="Imagen objetivo de prueba MindAR">
    <p class="note">Cuando el celular la reconozca, debería abrirse el video de YouTube.</p>
  </main>
</body>
</html>
